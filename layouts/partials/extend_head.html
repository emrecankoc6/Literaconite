<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('lc-theme') || 'midnight';
      var savedFont = localStorage.getItem('lc-font') || 'serif';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.setAttribute('data-font', savedFont);
    } catch(e) {}
  })();
</script>
