  <div style="color: var(--lc-red); font-size: 1.2rem; margin-bottom: 1.2rem; opacity: 0.8;">❦</div>
  <p style="margin: 0 0 0.5rem;">
    &copy; {{ now.Format "2006" }} <a href="{{ "" | absLangURL }}" style="color: var(--lc-text); font-weight: 500;">Literaconite</a> &bull; Emrecan Koç
