<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "auto" }}" data-theme="midnight">

<head>
    {{- partial "head.html" . }}
</head>

<body class="{{ if (or (ne .Kind `page` ) (eq .Layout `archives`) (eq .Layout `search`)) }}list{{ end }} section-{{ .Section }} kind-{{ .Kind }} {{ if .IsHome }}is-home{{ end }}" id="top">
    {{- partial "header.html" . }}
    <main class="main">
        {{- block "main" . }}{{ end }}
    </main>
    {{- partial "footer.html" . }}
</body>

</html>
